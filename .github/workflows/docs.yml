name: Docs

# Build marvell-docs on every push on any rls-* branch or tag mentioned in
# rls-202511.01:/marvell-docss/SONiC/releases/releases.yaml
#
# This is the main branch to generate docs while other release branches maintains
# - marvell-docs/<core-content>
# - SONIC/releases/release-notes.md
# - .github/workflows/docs.html (to trigger docs-gen here, when commit pushed on those branches

on:
  push:
    branches:
      - '**'
    tags:
      - 'rls-*'
  workflow_dispatch:

env:
  DOCS_RELEASES_POLICY_BRANCH: rls-202511.01

permissions:
  contents: read

jobs:
  build:
    name: Build docs (validate)
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marvell-docs/requirements.txt

      - name: Install doc-build dependencies
        run: pip install -r marvell-docs/requirements.txt

      - name: Build HTML docs
        run: make -C marvell-docs html

  deploy-eligibility:
    name: Check Pages deploy eligibility
    needs: build
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Decide whether to deploy
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          POLICY_BRANCH: ${{ env.DOCS_RELEASES_POLICY_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          eligible=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            eligible=true
          elif [[ "$REF_TYPE" == "tag" ]]; then
            eligible=true
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            eligible=true
          elif [[ "$REF_NAME" == "$POLICY_BRANCH" ]]; then
            eligible=true
          fi
          echo "Deploy eligibility for ${REF_TYPE} ${REF_NAME} -> ${eligible}"
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy docs to Pages
    needs: [build, deploy-eligibility]
    if: needs.deploy-eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marvell-docs/requirements.txt

      - name: Install doc-build dependencies
        run: pip install -r marvell-docs/requirements.txt

      - name: Materialize canonical release metadata
        if: github.ref_name != env.DOCS_RELEASES_POLICY_BRANCH
        run: |
          set -euo pipefail
          policy="${{ env.DOCS_RELEASES_POLICY_BRANCH }}"
          git fetch origin "${policy}"
          git checkout "origin/${policy}" -- \
            marvell-docs/SONIC/releases/releases.yaml \
            marvell-docs/_scripts/build-site.sh

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build all versions
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          BASE="${BASE_URL%/}"
          SITE="${RUNNER_TEMP}/site"
          marvell-docs/_scripts/build-site.sh --output "$SITE" --base "$BASE"
          echo "Assembled site with versions:"
          ls -1 "$SITE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

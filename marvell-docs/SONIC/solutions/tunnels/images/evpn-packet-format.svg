<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a41">1. host1 &#8594; switch1 (access port Ethernet1): original frame</text>
<rect x="350" y="48" width="170" height="100" fill="#e1d2f5" stroke="#7b4fc4" stroke-width="3"/>
<text x="435.0" y="78" fill="#3b1f73" font-size="20" font-weight="bold" text-anchor="middle">Ethernet</text>
<text x="435.0" y="106" fill="#3b1f73" font-size="17" text-anchor="middle">SMAC: host1 MAC</text>
<text x="435.0" y="130" fill="#3b1f73" font-size="17" text-anchor="middle">DMAC: host2 MAC</text>
<rect x="520" y="48" width="210" height="100" fill="#cdeccf" stroke="#2e9a4d" stroke-width="3"/>
<text x="625.0" y="78" fill="#14532d" font-size="20" font-weight="bold" text-anchor="middle">IP</text>
<text x="625.0" y="106" fill="#14532d" font-size="17" text-anchor="middle">SIP: 192.168.100.11</text>
<text x="625.0" y="130" fill="#14532d" font-size="17" text-anchor="middle">DIP: 192.168.100.12</text>
<rect x="730" y="48" width="120" height="100" fill="#fff0a8" stroke="#b58900" stroke-width="3"/>
<text x="790.0" y="92.0" fill="#5c4400" font-size="20" font-weight="bold" text-anchor="middle">Payload</text>
<text x="790.0" y="120.0" fill="#5c4400" font-size="17" text-anchor="middle">ICMP echo</text>
<line x1="600" y1="160" x2="600" y2="214" stroke="#e08a00" stroke-width="7"/><polygon points="584,210 616,210 600,236" fill="#e08a00"/>
<text x="635" y="196" font-size="21" font-weight="bold" fill="#b86e00">Encapsulation on switch1 (VTEP 10.1.1.0)</text>
<text x="600" y="268" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a41">2. switch1 Ethernet0 &#8594; underlay &#8594; switch2 Ethernet0: VXLAN packet</text>
<rect x="30" y="286" width="185" height="100" fill="#cfd6df" stroke="#5b6b7f" stroke-width="3"/>
<text x="122.5" y="316" fill="#1b2a41" font-size="20" font-weight="bold" text-anchor="middle">Outer Ethernet</text>
<text x="122.5" y="344" fill="#1b2a41" font-size="17" text-anchor="middle">SMAC: switch1 Eth0</text>
<text x="122.5" y="368" fill="#1b2a41" font-size="17" text-anchor="middle">DMAC: switch2 Eth0</text>
<rect x="215" y="286" width="190" height="100" fill="#bcd7f5" stroke="#2f6fb5" stroke-width="3"/>
<text x="310.0" y="316" fill="#16365c" font-size="20" font-weight="bold" text-anchor="middle">Outer IP</text>
<text x="310.0" y="344" fill="#16365c" font-size="17" text-anchor="middle">SIP: 10.1.1.0</text>
<text x="310.0" y="368" fill="#16365c" font-size="17" text-anchor="middle">DIP: 10.1.1.1</text>
<rect x="405" y="286" width="150" height="100" fill="#c7ece8" stroke="#1b8a80" stroke-width="3"/>
<text x="480.0" y="316" fill="#0d4f49" font-size="20" font-weight="bold" text-anchor="middle">Outer UDP</text>
<text x="480.0" y="344" fill="#0d4f49" font-size="17" text-anchor="middle">dst port: 4789</text>
<text x="480.0" y="368" fill="#0d4f49" font-size="17" text-anchor="middle">src: hashed</text>
<rect x="555" y="286" width="130" height="100" fill="#ffd9a8" stroke="#e08a00" stroke-width="3"/>
<text x="620.0" y="316" fill="#7a4300" font-size="20" font-weight="bold" text-anchor="middle">VXLAN</text>
<text x="620.0" y="344" fill="#7a4300" font-size="17" text-anchor="middle">VNI: 1000</text>
<text x="620.0" y="368" fill="#7a4300" font-size="17" text-anchor="middle">(VLAN 100)</text>
<rect x="685" y="286" width="170" height="100" fill="#e1d2f5" stroke="#7b4fc4" stroke-width="3"/>
<text x="770.0" y="316" fill="#3b1f73" font-size="20" font-weight="bold" text-anchor="middle">Inner Ethernet</text>
<text x="770.0" y="344" fill="#3b1f73" font-size="17" text-anchor="middle">SMAC: host1 MAC</text>
<text x="770.0" y="368" fill="#3b1f73" font-size="17" text-anchor="middle">DMAC: host2 MAC</text>
<rect x="855" y="286" width="210" height="100" fill="#cdeccf" stroke="#2e9a4d" stroke-width="3"/>
<text x="960.0" y="316" fill="#14532d" font-size="20" font-weight="bold" text-anchor="middle">Inner IP</text>
<text x="960.0" y="344" fill="#14532d" font-size="17" text-anchor="middle">SIP: 192.168.100.11</text>
<text x="960.0" y="368" fill="#14532d" font-size="17" text-anchor="middle">DIP: 192.168.100.12</text>
<rect x="1065" y="286" width="120" height="100" fill="#fff0a8" stroke="#b58900" stroke-width="3"/>
<text x="1125.0" y="330.0" fill="#5c4400" font-size="20" font-weight="bold" text-anchor="middle">Payload</text>
<text x="1125.0" y="358.0" fill="#5c4400" font-size="17" text-anchor="middle">ICMP echo</text>
<line x1="600" y1="398" x2="600" y2="452" stroke="#d9534f" stroke-width="7"/><polygon points="584,448 616,448 600,474" fill="#d9534f"/>
<text x="635" y="434" font-size="21" font-weight="bold" fill="#b03a37">Decapsulation on switch2 (VTEP 10.1.1.1)</text>
<text x="600" y="506" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a41">3. switch2 &#8594; host2 (access port Ethernet1): original frame</text>
<rect x="350" y="524" width="170" height="100" fill="#e1d2f5" stroke="#7b4fc4" stroke-width="3"/>
<text x="435.0" y="554" fill="#3b1f73" font-size="20" font-weight="bold" text-anchor="middle">Ethernet</text>
<text x="435.0" y="582" fill="#3b1f73" font-size="17" text-anchor="middle">SMAC: host1 MAC</text>
<text x="435.0" y="606" fill="#3b1f73" font-size="17" text-anchor="middle">DMAC: host2 MAC</text>
<rect x="520" y="524" width="210" height="100" fill="#cdeccf" stroke="#2e9a4d" stroke-width="3"/>
<text x="625.0" y="554" fill="#14532d" font-size="20" font-weight="bold" text-anchor="middle">IP</text>
<text x="625.0" y="582" fill="#14532d" font-size="17" text-anchor="middle">SIP: 192.168.100.11</text>
<text x="625.0" y="606" fill="#14532d" font-size="17" text-anchor="middle">DIP: 192.168.100.12</text>
<rect x="730" y="524" width="120" height="100" fill="#fff0a8" stroke="#b58900" stroke-width="3"/>
<text x="790.0" y="568.0" fill="#5c4400" font-size="20" font-weight="bold" text-anchor="middle">Payload</text>
<text x="790.0" y="596.0" fill="#5c4400" font-size="17" text-anchor="middle">ICMP echo</text>
</svg>
